es:{names:["Términos y condiciones","Política de privacidad","Uso de IA y regulación","Reembolsos","Cookies"],upd:"Última actualización",back:"Volver a orbe",note:"Este texto es una base general redactada para orbe y no sustituye la revisión de un abogado en cada jurisdicción donde vendas.",
terminos:`<h2>1. Quiénes somos</h2><p>orbe es un servicio de ${CO}, con domicilio en ${ADDR} (${STATE}, EE. UU.). Contacto: ${MAIL}.</p>
<h2>2. Qué ofrecemos</h2><p>orbe ofrece análisis educativos sobre modelos de negocio en la economía orbital: el radar web, el orbe brief (reporte y modelo editable), sesiones orbe sprint y briefings para empresas. Las cifras son estimaciones con supuestos visibles. <b>Nada en orbe es asesoría de inversión, financiera, legal ni recomendación para comprar o vender valores.</b> Tú decides cómo usar la información.</p>
<h2>3. Cuenta</h2><p>Para el acceso completo necesitas una cuenta con un correo verificado o con Google. Eres responsable de mantener tu contraseña segura. Debes tener al menos 16 años.</p>
<h2>4. Licencia de uso</h2><p>Al comprar recibes una licencia personal, no exclusiva e intransferible para usar el brief y el radar. No puedes revender, redistribuir ni publicar el contenido completo. Puedes citar fragmentos breves mencionando la fuente.</p>
<h2>5. Pagos</h2><p>Los pagos se procesan a través de Polar (Polar Software Inc.), que actúa como comerciante registrado (Merchant of Record) y calcula los impuestos aplicables. Los precios están en dólares estadounidenses. orbe no almacena datos de tarjetas.</p>
<h2>6. Sesiones</h2><p>Los sprints y briefings se agendan por Cal.com. Puedes reprogramar hasta 24 horas antes.</p>
<h2>7. Limitación de responsabilidad</h2><p>orbe se ofrece \"tal cual\". En la medida que lo permita la ley, nuestra responsabilidad total se limita al monto que pagaste en los últimos 12 meses. No respondemos por decisiones de negocio o inversión tomadas con base en el contenido.</p>
<h2>8. Cambios y ley aplicable</h2><p>Podemos actualizar estos términos y te avisaremos de cambios importantes. Se rigen por las leyes de ${STATE}, EE. UU., sin perjuicio de los derechos que te otorguen las leyes de protección al consumidor de tu país.</p>`,
privacidad:`<h2>1. Responsable</h2><p>${CO} (${ADDR}) es responsable del tratamiento de tus datos. Contacto para privacidad: ${MAIL}.</p>
<h2>2. Qué datos recogemos</h2><ul><li><b>Cuenta:</b> correo, nombre y, si usas Google, tu foto de perfil.</li><li><b>Formularios:</b> nombre, correo, empresa, país y mensaje que nos envías.</li><li><b>Newsletter:</b> tu correo, si te suscribes.</li><li><b>Compras:</b> Polar nos comparte tu correo, producto e importe. No recibimos datos de tarjeta.</li><li><b>Uso:</b> preferencias de idioma y tema, y las ideas que guardas en el radar, que se quedan en tu navegador.</li></ul>
<h2>3. Para qué y con qué base</h2><p>Para darte acceso a lo que compraste (ejecución del contrato), responder tus mensajes y enviarte el newsletter (consentimiento), y mejorar el servicio y prevenir fraude (interés legítimo). No vendemos tus datos ni los usamos para publicidad de terceros.</p>
<h2>4. Proveedores</h2><p>Google Firebase (autenticación y base de datos), Polar (pagos), Vercel (alojamiento), Substack (newsletter), FormSubmit (envío de formularios al correo) y Cal.com (agenda). Algunos procesan datos en Estados Unidos con las garantías contractuales correspondientes.</p>
<h2>5. Cuánto tiempo</h2><p>Datos de cuenta: mientras la cuenta exista. Mensajes: hasta 24 meses. Registros de compra: el tiempo que exija la ley tributaria.</p>
<h2>6. Tus derechos</h2><p>Puedes acceder, rectificar, eliminar, oponerte, limitar el uso y pedir la portabilidad de tus datos, y retirar tu consentimiento en cualquier momento. Esto incluye los derechos ARCO (Perú, Ley 29733), los del RGPD (UE), la LGPD (Brasil) y la CCPA/CPRA (California). Escríbenos a ${MAIL}; respondemos en un plazo máximo de 30 días. También puedes reclamar ante tu autoridad de protección de datos.</p>`,
ia:`<h2>1. Nuestro compromiso</h2><p>Queremos que sepas siempre cuándo interviene la inteligencia artificial en orbe y que ninguna decisión importante sobre ti dependa solo de un sistema automático.</p>
<h2>2. Dónde usamos IA y dónde no</h2><ul><li><b>El radar y la landing no usan IA:</b> los cálculos son fórmulas fijas que se ejecutan en tu navegador.</li><li><b>No tomamos decisiones automatizadas</b> con efectos legales o significativos sobre ti, ni hacemos perfiles para publicidad.</li><li><b>Contenido asistido:</b> algunos textos (publicaciones, borradores del brief, traducciones) se elaboran con ayuda de herramientas de IA generativa y siempre son revisados y aprobados por una persona del equipo.</li><li><b>Tus datos no entrenan modelos:</b> no usamos lo que nos envías para entrenar sistemas de IA.</li></ul>
<h2>3. Marcos que seguimos</h2><p>Aplicamos los principios de transparencia del Reglamento de IA de la Unión Europea (Reglamento (UE) 2024/1689, en especial su artículo 50 sobre informar cuando se interactúa con IA o se publica contenido generado por IA), el artículo 22 del RGPD y el artículo 20 de la LGPD de Brasil sobre decisiones automatizadas, la Ley 31814 de Perú sobre el uso ético y transparente de la IA, y las normas de protección al consumidor que prohíben afirmaciones engañosas sobre IA, como las de la FTC en EE. UU. orbe no opera sistemas de IA de alto riesgo.</p>
<h2>4. Si cambiamos</h2><p>Si incorporamos un asistente o una función de IA, lo indicaremos de forma visible antes de que la uses y actualizaremos esta página.</p>
<h2>5. Consultas</h2><p>Para cualquier pregunta sobre IA o para pedir que una persona revise algo, escríbenos a ${MAIL}.</p>`,
reembolsos:`<h2>orbe brief</h2><p>Si el brief no te sirve, pide el reembolso dentro de los 7 días posteriores a la compra escribiendo a ${MAIL}. Lo procesamos a través de Polar y el acceso completo se desactiva.</p>
<h2>orbe sprint</h2><p>Reembolso total si cancelas al menos 24 horas antes de la sesión. Después de realizada la sesión no hay reembolso.</p>
<h2>Briefings para empresas</h2><p>Se rigen por la cotización aceptada.</p>
<h2>Cómo se acredita</h2><p>Polar devuelve el dinero al mismo medio de pago. El plazo depende de tu banco, normalmente entre 5 y 10 días hábiles.</p>`,
cookies:`<h2>Qué guardamos en tu navegador</h2><ul><li><b>Esenciales:</b> la sesión de tu cuenta (Firebase) y tus preferencias de idioma y tema.</li><li><b>Funcionales:</b> las ideas que guardas en el radar, que se quedan solo en tu dispositivo.</li></ul>
<h2>Qué no usamos</h2><p>No usamos cookies publicitarias ni de seguimiento entre sitios.</p>
<h2>Terceros</h2><p>Al pagar en Polar, iniciar sesión con Google o agendar en Cal.com, esos servicios pueden usar sus propias cookies según sus políticas.</p>
<h2>Cómo borrarlas</h2><p>Puedes borrarlas desde la configuración de tu navegador; si lo haces, se cerrará tu sesión.</p>`},
en:{names:["Terms and conditions","Privacy policy","AI use and regulation","Refunds","Cookies"],upd:"Last updated",back:"Back to orbe",note:"This is a general baseline written for orbe and does not replace review by a lawyer in each jurisdiction where you sell.",
terminos:`<h2>1. Who we are</h2><p>orbe is a service of ${CO}, located at ${ADDR} (${STATE}, USA). Contact: ${MAIL}.</p>
<h2>2. What we offer</h2><p>orbe offers educational analysis of business models in the orbital economy: the web radar, the orbe brief (report and editable model), orbe sprint sessions and company briefings. Figures are estimates with visible assumptions. <b>Nothing in orbe is investment, financial or legal advice, or a recommendation to buy or sell securities.</b> You decide how to use the information.</p>
<h2>3. Account</h2><p>Full access requires an account with a verified email or Google. You are responsible for keeping your password safe. You must be at least 16 years old.</p>
<h2>4. License</h2><p>When you buy, you get a personal, non-exclusive, non-transferable license to use the brief and the radar. You may not resell, redistribute or publish the full content. You may quote short excerpts with attribution.</p>
<h2>5. Payments</h2><p>Payments are processed by Polar (Polar Software Inc.), which acts as Merchant of Record and calculates applicable taxes. Prices are in US dollars. orbe does not store card data.</p>
<h2>6. Sessions</h2><p>Sprints and briefings are booked via Cal.com. You can reschedule up to 24 hours before.</p>
<h2>7. Limitation of liability</h2><p>orbe is provided \"as is\". To the extent permitted by law, our total liability is limited to the amount you paid in the last 12 months. We are not liable for business or investment decisions based on the content.</p>
<h2>8. Changes and governing law</h2><p>We may update these terms and will notify you of material changes. They are governed by the laws of ${STATE}, USA, without prejudice to the rights granted by your country’s consumer protection laws.</p>`,
privacidad:`<h2>1. Controller</h2><p>${CO} (${ADDR}) is responsible for your data. Privacy contact: ${MAIL}.</p>
<h2>2. What we collect</h2><ul><li><b>Account:</b> email, name and, if you use Google, your profile photo.</li><li><b>Forms:</b> name, email, company, country and the message you send.</li><li><b>Newsletter:</b> your email, if you subscribe.</li><li><b>Purchases:</b> Polar shares your email, product and amount. We never receive card data.</li><li><b>Usage:</b> language and theme preferences, and the ideas you save in the radar, which stay in your browser.</li></ul>
<h2>3. Why and on what basis</h2><p>To give you access to what you bought (contract), reply to your messages and send the newsletter (consent), and improve the service and prevent fraud (legitimate interest). We do not sell your data or use it for third-party advertising.</p>
<h2>4. Providers</h2><p>Google Firebase (authentication and database), Polar (payments), Vercel (hosting), Substack (newsletter), FormSubmit (form delivery to email) and Cal.com (scheduling). Some process data in the United States under appropriate contractual safeguards.</p>
<h2>5. Retention</h2><p>Account data: while the account exists. Messages: up to 24 months. Purchase records: as long as tax law requires.</p>
<h2>6. Your rights</h2><p>You can access, correct, delete, object to, restrict and port your data, and withdraw consent at any time, including your rights under the GDPR (EU), LGPD (Brazil), CCPA/CPRA (California) and Peru’s Law 29733. Email ${MAIL}; we reply within 30 days. You may also complain to your data protection authority.</p>`,
ia:`<h2>1. Our commitment</h2><p>We want you to always know when artificial intelligence is involved in orbe, and no important decision about you will rely solely on an automated system.</p>
<h2>2. Where we use AI and where we don’t</h2><ul><li><b>The radar and the landing page do not use AI:</b> calculations are fixed formulas that run in your browser.</li><li><b>We make no automated decisions</b> with legal or similarly significant effects on you, and we do no ad profiling.</li><li><b>Assisted content:</b> some texts (posts, brief drafts, translations) are prepared with generative AI tools and are always reviewed and approved by a person on our team.</li><li><b>Your data does not train models:</b> we do not use what you send us to train AI systems.</li></ul>
<h2>3. Frameworks we follow</h2><p>We apply the transparency principles of the EU AI Act (Regulation (EU) 2024/1689, especially Article 50 on disclosing AI interactions and AI-generated content), GDPR Article 22 and Brazil’s LGPD Article 20 on automated decisions, Peru’s Law 31814 on the ethical and transparent use of AI, and consumer-protection rules against deceptive AI claims, such as the US FTC’s. orbe does not operate high-risk AI systems.</p>
<h2>4. If we change</h2><p>If we add an AI assistant or feature, we will say so visibly before you use it and update this page.</p>
<h2>5. Questions</h2><p>For any question about AI, or to ask a person to review something, email ${MAIL}.</p>`,
reembolsos:`<h2>orbe brief</h2><p>If the brief isn’t useful, request a refund within 7 days of purchase by emailing ${MAIL}. We process it through Polar and full access is turned off.</p>
<h2>orbe sprint</h2><p>Full refund if you cancel at least 24 hours before the session. No refund after the session has taken place.</p>
<h2>Company briefings</h2><p>Governed by the accepted quote.</p>
<h2>How refunds arrive</h2><p>Polar returns the money to the original payment method. Timing depends on your bank, usually 5 to 10 business days.</p>`,
cookies:`<h2>What we store in your browser</h2><ul><li><b>Essential:</b> your account session (Firebase) and language and theme preferences.</li><li><b>Functional:</b> the ideas you save in the radar, which stay only on your device.</li></ul>
<h2>What we don’t use</h2><p>No advertising or cross-site tracking cookies.</p>

<h2>How to delete them</h2><p>Clear them in your browser settings; doing so logs you out.</p>`},

privacidad:`<h2>1. Controlador</h2><p>A ${CO} (${ADDR}) é a controladora dos seus dados. Contato de privacidade: ${MAIL}.</p>

<h2>5. Retenção</h2><p>Dados da conta: enquanto a conta existir. Mensagens: até 24 meses. Registros de compra: pelo prazo exigido pela lei tributária.</p>
<h2>6. Seus direitos (LGPD)</h2><p>Você pode confirmar o tratamento, acessar, corrigir, anonimizar, eliminar, portar seus dados e revogar o consentimento a qualquer momento. Escreva para ${MAIL}; respondemos em até 15 dias. Você também pode reclamar à ANPD.</p>`,
ia:`<h2>1. Nosso compromisso</h2><p>Queremos que você sempre saiba quando a inteligência artificial participa da orbe, e nenhuma decisão importante sobre você dependerá apenas de um sistema automatizado.</p>

terminos:`<h2>1. Qui sommes-nous</h2><p>orbe est un service de ${CO}, situé ${ADDR} (${STATE}, États-Unis). Contact : ${MAIL}.</p>
<h2>2. Ce que nous proposons</h2><p>orbe propose des analyses pédagogiques de modèles d’affaires de l’économie orbitale : le radar web, le orbe brief (rapport et modèle modifiable), les séances orbe sprint et des briefings pour entreprises. Les chiffres sont des estimations aux hypothèses visibles. <b>Rien dans orbe ne constitue un conseil en investissement, financier ou juridique, ni une recommandation d’achat ou de vente de titres.</b> Vous décidez de l’usage de l’information.</p>
<h2>3. Compte</h2><p>L’accès complet nécessite un compte avec e-mail vérifié ou Google. Vous êtes responsable de la sécurité de votre mot de passe. Vous devez avoir au moins 16 ans.</p>
<h2>4. Licence</h2><p>À l’achat, vous recevez une licence personnelle, non exclusive et non cessible pour utiliser le brief et le radar. Il est interdit de revendre, redistribuer ou publier le contenu intégral. Les courtes citations avec la source sont autorisées.</p>
<h2>5. Paiements</h2><p>Les paiements sont traités par Polar (Polar Software Inc.), qui agit en tant que Merchant of Record et calcule les taxes applicables. Prix en dollars US. orbe ne conserve aucune donnée de carte.</p>
<h2>6. Séances</h2><p>Les sprints et briefings se réservent via Cal.com. Report possible jusqu’à 24 heures avant.</p>
<h2>7. Limitation de responsabilité</h2><p>orbe est fourni « en l’état ». Dans la mesure permise par la loi, notre responsabilité totale est limitée au montant payé au cours des 12 derniers mois. Nous ne sommes pas responsables des décisions d’affaires ou d’investissement fondées sur le contenu.</p>
<h2>8. Modifications et droit applicable</h2><p>Nous pouvons mettre à jour ces conditions et vous informerons des changements importants. Elles sont régies par le droit de ${STATE} (États-Unis), sans préjudice des droits que vous accorde le droit de la consommation de votre pays.</p>`,
privacidad:`<h2>1. Responsable du traitement</h2><p>${CO} (${ADDR}) est responsable de vos données. Contact confidentialité : ${MAIL}.</p>
<h2>2. Données collectées</h2><ul><li><b>Compte :</b> e-mail, nom et, avec Google, votre photo de profil.</li><li><b>Formulaires :</b> nom, e-mail, entreprise, pays et message envoyé.</li><li><b>Newsletter :</b> votre e-mail, si vous vous abonnez.</li><li><b>Achats :</b> Polar nous transmet votre e-mail, le produit et le montant. Nous ne recevons jamais de données de carte.</li><li><b>Usage :</b> préférences de langue et de thème, et les idées enregistrées dans le radar, qui restent dans votre navigateur.</li></ul>
<h2>3. Finalités et bases légales</h2><p>Vous donner accès à vos achats (exécution du contrat), répondre à vos messages et envoyer la newsletter (consentement), améliorer le service et prévenir la fraude (intérêt légitime). Nous ne vendons pas vos données et ne les utilisons pas pour de la publicité tierce.</p>
<h2>4. Sous-traitants</h2><p>Google Firebase (authentification et base de données), Polar (paiements), Vercel (hébergement), Substack (newsletter), FormSubmit (envoi des formulaires par e-mail) et Cal.com (agenda). Certains traitent des données aux États-Unis avec des garanties contractuelles appropriées.</p>
<h2>5. Conservation</h2><p>Données de compte : tant que le compte existe. Messages : jusqu’à 24 mois. Données d’achat : durée exigée par la loi fiscale.</p>
<h2>6. Vos droits (RGPD)</h2><p>Vous pouvez accéder à vos données, les rectifier, les effacer, vous opposer, limiter leur traitement, demander leur portabilité et retirer votre consentement à tout moment. Écrivez à ${MAIL} ; nous répondons sous 30 jours. Vous pouvez aussi saisir la CNIL ou votre autorité de contrôle.</p>`,
ia:`<h2>1. Notre engagement</h2><p>Nous voulons que vous sachiez toujours quand l’intelligence artificielle intervient dans orbe, et aucune décision importante vous concernant ne reposera uniquement sur un système automatisé.</p>
<h2>2. Où nous utilisons l’IA, et où non</h2><ul><li><b>Le radar et la page d’accueil n’utilisent pas d’IA :</b> les calculs sont des formules fixes exécutées dans votre navigateur.</li><li><b>Aucune décision automatisée</b> produisant des effets juridiques ou significatifs à votre égard, ni profilage publicitaire.</li><li><b>Contenus assistés :</b> certains textes (publications, ébauches du brief, traductions) sont préparés avec des outils d’IA générative et sont toujours relus et validés par une personne de l’équipe.</li><li><b>Vos données n’entraînent pas de modèles :</b> nous n’utilisons pas ce que vous nous envoyez pour entraîner des systèmes d’IA.</li></ul>
<h2>3. Cadres que nous suivons</h2><p>Nous appliquons les principes de transparence du règlement européen sur l’IA (règlement (UE) 2024/1689, notamment son article 50), l’article 22 du RGPD sur les décisions automatisées, les recommandations de la CNIL, la loi péruvienne 31814 sur l’usage éthique et transparent de l’IA, et les règles de protection des consommateurs contre les allégations trompeuses sur l’IA. orbe n’exploite aucun système d’IA à haut risque.</p>
<h2>4. En cas de changement</h2><p>Si nous ajoutons un assistant ou une fonction d’IA, nous l’indiquerons clairement avant usage et mettrons cette page à jour.</p>
<h2>5. Questions</h2><p>Pour toute question sur l’IA, ou pour demander une revue humaine, écrivez à ${MAIL}.</p>`,
reembolsos:`<h2>orbe brief</h2><p>Si le brief ne vous est pas utile, demandez le remboursement sous 7 jours après l’achat en écrivant à ${MAIL}. Nous le traitons via Polar et l’accès complet est désactivé.</p>

let lang="es";

function render(){
  const d=D[lang];let id=location.hash.replace("#","").split("-")[0];if(!IDS.includes(id))id="terminos";
  document.documentElement.lang=lang;document.title="orbe · "+d.names[IDS.indexOf(id)];
  document.getElementById("side").innerHTML=IDS.map((k,i)=>`<a href="#${k}" aria-current="${k===id}">${d.names[i]}</a>`).join("")+`<a href="index.html">← ${d.back}</a>`;
  document.getElementById("doc").innerHTML=`<h1>${d.names[IDS.indexOf(id)]}</h1><div class="meta">${d.upd}: ${UPD} · ${CO}</div>${d[id]}<p class="note">${d.note}</p>`;
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  document.getElementById("foot").textContent=`© 2026 ${CO} · ${MAIL}`;
}
