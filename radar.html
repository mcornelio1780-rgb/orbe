<style>
:root{
  --llama:#FF5A1F;--senal:#8FA8FF;
  --bg:#070A1C;--panel:#0D1330;--panel2:#111A40;--fg:#F2F4F8;--muted:#A3A9C2;--dim:#6F7798;--line:#232A4D;--on:#1B2557;
  --serif:"Fraunces",Georgia,serif;--sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#F2F4F8;--panel:#FFFFFF;--panel2:#EEF1F7;--fg:#0D1330;--muted:#50566E;--dim:#7A8099;--line:#D9DEEA;--on:#FFE6DB;color-scheme:light}}
:root[data-theme="light"]{--bg:#F2F4F8;--panel:#FFFFFF;--panel2:#EEF1F7;--fg:#0D1330;--muted:#50566E;--dim:#7A8099;--line:#D9DEEA;--on:#FFE6DB;color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--llama);outline-offset:2px;border-radius:6px}
header{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
.bar{max-width:1320px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:7px;font-family:var(--serif);font-weight:600;font-size:1.4rem;letter-spacing:-.03em;text-decoration:none;color:var(--fg)}
.logo svg{height:1.15em;width:auto}
.logo small{font-family:var(--sans);font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:2px}
.sp{flex:1}
@media(max-width:480px){.bar{gap:8px;padding:0 12px}.seg button{padding:4px 7px}#homeLink{display:none}}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{background:none;border:0;padding:4px 9px;border-radius:999px;font-size:.78rem;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:9px 16px;font-weight:700;font-size:.88rem;border:1.5px solid var(--line);background:none;cursor:pointer;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--llama);border-color:var(--llama);color:#0D1330}
.icon{width:36px;height:36px;padding:0;border-radius:50%}
.layout{max-width:1320px;margin:0 auto;padding:20px;display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
aside{position:sticky;top:80px;display:flex;flex-direction:column;gap:14px}
@media(max-width:980px){aside{position:static}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.price{font-family:var(--serif);font-size:2.6rem;font-weight:600;line-height:1}
.price small{font-family:var(--sans);font-size:.85rem;color:var(--muted);font-weight:500}
.era{color:var(--senal);font-size:.85rem;margin-top:4px;min-height:1.3em}
input[type=range]{width:100%;accent-color:var(--llama);margin:14px 0 4px;height:26px}
.ticks{display:flex;justify-content:space-between;font-size:.7rem;color:var(--dim)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.presets button{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:.76rem;cursor:pointer;color:var(--muted)}
.presets button:hover{color:var(--fg)}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.stat:last-child{border:0}
.stat b{font-family:var(--serif);font-size:1.5rem;font-weight:600}
.stat b.hot{color:var(--llama)}
h2{font-family:var(--serif);font-weight:600;font-size:1.15rem;margin:0 0 8px;letter-spacing:-.01em}
.lbl{font-size:.8rem;color:var(--muted);display:block;margin-bottom:4px}
.field{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.row{display:flex;gap:8px}
.muted{color:var(--muted)}
.small{font-size:.8rem}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .field{width:auto;flex:1 1 200px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.8rem;cursor:pointer;color:var(--muted)}
.chips button[aria-pressed="true"]{border-color:var(--fg);color:var(--fg);background:var(--panel2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.case{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;position:relative;transition:border-color .2s,background .2s;min-height:150px}
.case:hover{border-color:var(--dim)}
.case.on{background:var(--on);border-color:var(--llama)}
.case .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:.7rem;font-weight:700;color:var(--muted);background:var(--panel2);border-radius:999px;padding:3px 8px}
.case.on .tag{background:rgba(255,90,31,.15);color:var(--llama)}
.case h3{font-family:var(--serif);font-weight:600;font-size:1.12rem;line-height:1.15;margin:0}
.case p{margin:0;font-size:.85rem;color:var(--muted)}
.case .be{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:.82rem}
.case .be b{font-size:.95rem}
.meter{height:4px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:4px}
.meter span{display:block;height:100%;background:var(--llama);border-radius:4px}
.case.locked h3,.case.locked p,.case.locked .be{filter:blur(5px);user-select:none}
.lock{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:.85rem;color:var(--fg)}
.lock span{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:7px 12px}
.empty{padding:40px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
/* drawer */
dialog{border:0;padding:0;background:transparent;max-width:min(720px,94vw);width:100%;color:var(--fg)}
dialog::backdrop{background:rgba(7,10,28,.7)}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px;max-height:88vh;overflow:auto}
.sheet h2{font-size:1.6rem}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
@media(max-width:560px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--panel2);border-radius:14px;padding:12px}
.kpi b{display:block;font-family:var(--serif);font-size:1.4rem;font-weight:600}
.kpi.good b{color:#3DD68C}.kpi.bad b{color:#FF6B6B}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.inputs{grid-template-columns:1fr}}
.chart{margin-top:16px;background:var(--panel2);border-radius:14px;padding:12px;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:420px;height:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.88rem;opacity:0;transition:.25s;z-index:99;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
.cta-panel{background:var(--llama);color:#0D1330;border:0}
.cta-panel .btn{border-color:#0D1330;color:#0D1330}
.cta-panel .btn.dark{background:#0D1330;color:#F2F4F8}
.note{font-size:.75rem;color:var(--dim);margin-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const store={get(k,d){try{const v=localStorage.getItem("orbe-radar-"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("orbe-radar-"+k,JSON.stringify(v))}catch(e){}}};
let lang="es",sector="all",query="",sortBy="be";
let localUnlock=store.get("unlocked",false);
const authOn=()=>!!(window.orbe&&window.orbe.enabled);
let unlocked=false;
function computeUnlock(){unlocked=authOn()?!!window.orbe.pro:localUnlock;return unlocked}
computeUnlock();
let overrides=store.get("overrides",{});
let custom=store.get("custom",[]);
const NUM={es:"de-DE",en:"en-US",pt:"pt-BR",fr:"fr-FR"};
const fmt=(v,usd=true)=>{const a=Math.abs(v);let s;if(a>=1e6)s=(v/1e6).toLocaleString(NUM[lang],{maximumFractionDigits:1})+" M";else s=Math.round(v).toLocaleString(NUM[lang]);if(!usd)return s;return lang==="fr"?s+" $":lang==="pt"?"US$ "+s:(v<0?"-$"+s.replace("-",""):"$"+s)};
const $=id=>document.getElementById(id);

function cases(){
  const base=BASE.map(([k,s,m,r,c,u,n],i)=>{const o=overrides[k]||{};return{k,s,m:o.m??m,r:o.r??r,c:o.c??c,u:o.u??u,def:{m,r,c,u},name:n[lang][0],desc:n[lang][1],i}});
  const cus=custom.map((x,j)=>({...x,s:"custom",def:null,i:100+j}));
  return base.concat(cus).map(x=>({...x,be:(x.r-x.c)/x.m}));
}
function priceAt(v){const x=Math.pow(10,4-3*(v/1000));const m=Math.pow(10,Math.floor(Math.log10(x))-1);return Math.round(x/m)*m}
function sliderFor(p){return Math.round((4-Math.log10(p))/3*1000)}
const P=()=>priceAt(+$("slider").value);

function render(){
  const d=T[lang],p=P(),all=cases();
  $("price").innerHTML=fmt(p)+`<small>${d.per}</small>`;
  $("era").textContent=d.eras[p>4000?0:p>1200?1:p>350?2:p>60?3:4];
  $("ticks").innerHTML=[10000,1000,100,10].map(v=>`<span>${fmt(v)}</span>`).join("");
  const viable=all.filter(x=>p<=x.be);
  $("stViable").textContent=`${viable.length}/${all.length}`;
  const next=all.filter(x=>x.be<p&&x.be>0).sort((a,b)=>b.be-a.be)[0];
  $("stNext").textContent=next?`${next.name} · ${fmt(next.be)}`:"—";
  $("stCustom").textContent=custom.length;
  $("ctaPanel").style.display=unlocked?"none":"";
  // list
  let list=all.filter(x=>(sector==="all"||x.s===sector)&&(!query||(x.name+" "+x.desc).toLowerCase().includes(query)));
  const margin=x=>x.r-x.c-x.m*p;
  list.sort(sortBy==="name"?(a,b)=>a.name.localeCompare(b.name,lang):sortBy==="margin"?(a,b)=>margin(b)-margin(a):(a,b)=>{const ga=a.be>=p?-1:1,gb=b.be>=p?-1:1;if(ga!==gb)return ga-gb;return b.be-a.be});
  const freeKeys=new Set(BASE.slice(0,CFG.freeCases).map(x=>x[0]));
  $("grid").innerHTML=list.length?list.map(x=>{
    const on=p<=x.be,locked=!unlocked&&x.s!=="custom"&&!freeKeys.has(x.k);
    const pct=Math.max(4,Math.min(100,on?100:(Math.log10(10000)-Math.log10(p))/(Math.log10(10000)-Math.log10(Math.max(x.be,1)))*100));
    return `<button class="case ${on?"on":""} ${locked?"locked":""}" data-k="${x.k}" aria-label="${locked?d.locked:x.name}">
      <div class="top"><span class="tag">${SECT[x.s][lang]}</span><span class="small" style="font-weight:700;color:${on?"var(--llama)":"var(--dim)"}">${on?d.ok:d.no}</span></div>
      <h3>${esc(x.name)}</h3><p>${esc(x.desc)}</p>
      <div class="be"><span class="muted">${d.beL}</span><b>${fmt(x.be)}/kg</b></div>
      <div class="meter"><span style="width:${pct}%"></span></div>
      ${locked?`<div class="lock"><span>🔒 ${d.locked}</span></div>`:""}
    </button>`}).join(""):`<div class="empty">${d.none}</div>`;
  safeHash("#"+lang+"-"+Math.round(p));
}
function safeHash(h){try{if(location.hash!==h)history.replaceState(null,"",h)}catch(e){/* vista previa en sandbox: se ignora */}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function setLang(l){
  lang=T[l]?l:"es";const d=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  $("sliderLbl").textContent=d.slider;$("stViableL").textContent=d.viable;$("stNextL").textContent=d.next;$("stCustomL").textContent=d.custom;
  $("ctaT").textContent=d.ctaT;$("ctaD").textContent=d.ctaD;$("buyBtn").textContent=d.buy;$("codeBtn").textContent=d.code;
  $("subT").textContent=d.subT;$("subBtn").textContent=d.subBtn;$("subEmail").placeholder=d.email;
  $("q").placeholder=d.search;$("sort").innerHTML=d.sort.map(s=>`<option value="${s[0]}" ${s[0]===sortBy?"selected":""}>${s[1]}</option>`).join("");
  $("addBtn").textContent=d.add;$("csvBtn").textContent=d.csv;$("shareBtn").textContent=d.share;$("disc").textContent=d.disc;$("legalNav").innerHTML=d.legal.map((x,i)=>`<a style="color:inherit" href="legal.html#${["terminos","privacidad","ia","reembolsos","cookies"][i]}">${x}</a>`).join("");
  $("presets").innerHTML=PRESETS.map(p=>`<button data-p="${p[0]}">${p[1][lang]} · ${fmt(p[0])}</button>`).join("");
  const secs=["all","mfg","bio","data","log","infra","energy","consumer","custom"];
  $("chips").innerHTML=secs.map(s=>`<button data-s="${s}" aria-pressed="${s===sector}">${s==="all"?d.all:SECT[s][lang]}</button>`).join("");
  $("codeT").textContent=d.codeT;$("codeD").textContent=d.codeD;$("codeOk").textContent=d.codeOk;$("codeClose").textContent=d.close;
  store.set("lang",lang);render();
}

  else{const x=cases().find(c=>c.k===k);if(!x)return;
    const freeKeys=new Set(BASE.slice(0,CFG.freeCases).map(b=>b[0]));
    if(!unlocked&&x.s!=="custom"&&!freeKeys.has(x.k)){openCode();return}
    current={...x}}
  const x=current;
  $("sheet").innerHTML=`
    <div class="top" style="display:flex;justify-content:space-between;gap:10px;align-items:center"><span class="tag">${SECT[x.s][lang]}</span><button class="btn icon" id="dClose" aria-label="${d.close}">✕</button></div>
    ${x.s==="custom"?`<div class="inputs" style="margin-top:12px"><label><span class="lbl">${d.name}</span><input class="field" id="fName" value="${esc(x.name)}" required></label><label><span class="lbl">${d.desc}</span><input class="field" id="fDesc" value="${esc(x.desc)}"></label></div>`:`<h2 style="margin-top:10px">${esc(x.name)}</h2><p class="muted" style="margin:0">${esc(x.desc)}</p>`}
    <div class="kpis"><div class="kpi" id="kLaunch"><span class="small muted">${d.launch}</span><b></b></div><div class="kpi" id="kMargin"><span class="small muted">${d.margin}</span><b></b></div><div class="kpi" id="kBe"><span class="small muted">${d.be}</span><b></b></div></div>
    <div class="inputs">
      <label><span class="lbl">${d.mass}</span><input class="field" type="number" min="0.1" step="any" id="fM" value="${x.m}"></label>
      <label><span class="lbl">${d.rev}</span><input class="field" type="number" min="0" step="any" id="fR" value="${x.r}"></label>
      <label><span class="lbl">${d.cost}</span><input class="field" type="number" min="0" step="any" id="fC" value="${x.c}"></label>
      <label><span class="lbl">${d.units}</span><input class="field" type="number" min="0" step="1" id="fU" value="${x.u}"></label>
    </div>
    <div class="kpi" id="kYear" style="margin-top:12px"><span class="small muted">${d.year}</span><b></b></div>
    <div class="chart"><div class="small muted" style="margin-bottom:6px">${d.chart}</div><svg id="chart" viewBox="0 0 520 200" role="img" aria-label="${d.chart}"></svg></div>
    <div class="actions">
      ${x.def?`<button class="btn" id="dReset">${d.reset}</button>`:""}
      ${x.s==="custom"&&!x.isNew?`<button class="btn" id="dDel">${d.del}</button>`:""}
      <a class="btn" href="#" data-buy="sprint">${d.sprint}</a>
      <button class="btn primary" id="dSave">${d.save}</button>
    </div>`;
  ["fM","fR","fC","fU"].forEach(id=>$(id).addEventListener("input",calc));
  $("dClose").onclick=()=>$("dlg").close();
  $("dSave").onclick=save;
  if($("dReset"))$("dReset").onclick=()=>{delete overrides[x.k];store.set("overrides",overrides);$("dlg").close();render()};
  if($("dDel"))$("dDel").onclick=()=>{custom=custom.filter(c=>c.k!==x.k);store.set("custom",custom);$("dlg").close();render()};
  calc();$("dlg").showModal();
}
function vals(){return{m:Math.max(.1,+$("fM").value||.1),r:+$("fR").value||0,c:+$("fC").value||0,u:+$("fU").value||0}}
function calc(){
  const v=vals(),p=P(),launch=v.m*p,margin=v.r-v.c-launch,be=(v.r-v.c)/v.m,yr=margin*v.u;
  $("kLaunch").querySelector("b").textContent=fmt(launch);
  const km=$("kMargin");km.className="kpi "+(margin>=0?"good":"bad");km.querySelector("b").textContent=fmt(margin);
  $("kBe").querySelector("b").textContent=be>0?fmt(be)+"/kg":"—";
  const ky=$("kYear");ky.className="kpi "+(yr>=0?"good":"bad");ky.querySelector("b").textContent=fmt(yr);
  // chart: x = log price 10..10000, y = margin
  const W=520,H=200,L=56,R=10,Tp=10,B=26,xs=pr=>L+(Math.log10(pr)-1)/3*(W-L-R);
  const pts=[];for(let i=0;i<=60;i++){const pr=Math.pow(10,1+3*i/60);pts.push([pr,v.r-v.c-v.m*pr])}
  const ys=pts.map(q=>q[1]),mx=Math.max(...ys,0),mn=Math.min(...ys,0),sy=y=>Tp+(mx-y)/((mx-mn)||1)*(H-Tp-B);
  const path=pts.map((q,i)=>(i?"L":"M")+xs(q[0]).toFixed(1)+" "+sy(q[1]).toFixed(1)).join(" ");
  const col=getComputedStyle(document.documentElement).getPropertyValue("--fg");
  let s=`<line x1="${L}" x2="${W-R}" y1="${sy(0)}" y2="${sy(0)}" stroke="#8FA8FF" stroke-opacity=".5" stroke-dasharray="3 4"/>`;
  [10,100,1000,10000].forEach(t=>s+=`<text x="${xs(t)}" y="${H-6}" font-size="11" fill="#7E86A6" text-anchor="middle">${fmt(t)}</text>`);
  s+=`<text x="${L-6}" y="${sy(mx)+4}" font-size="11" fill="#7E86A6" text-anchor="end">${fmt(mx)}</text><text x="${L-6}" y="${sy(mn)}" font-size="11" fill="#7E86A6" text-anchor="end">${fmt(mn)}</text>`;
  s+=`<path d="${path}" fill="none" stroke="${col}" stroke-width="2.5"/>`;
  if(be>=10&&be<=10000)s+=`<circle cx="${xs(be)}" cy="${sy(0)}" r="6" fill="#FF5A1F"/>`;
  s+=`<line x1="${xs(p)}" x2="${xs(p)}" y1="${Tp}" y2="${H-B}" stroke="#FF5A1F" stroke-opacity=".6"/>`;
  $("chart").innerHTML=s;
}
function save(){
  const v=vals(),x=current;
  if(x.s==="custom"){const name=$("fName").value.trim();if(!name){$("fName").focus();return}
    const item={k:x.k,m:v.m,r:v.r,c:v.c,u:v.u,name,desc:$("fDesc").value.trim()};
    const i=custom.findIndex(c=>c.k===x.k);if(i>=0)custom[i]=item;else custom.push(item);store.set("custom",custom)}
  else{overrides[x.k]=v;store.set("overrides",overrides)}
  $("dlg").close();toast(T[lang].saved);render();
}

/* ===== código ===== */
function openCode(note){
  const d=T[lang];$("codeMsg").textContent=note||"";$("codeMsg").style.color=note?"var(--senal)":"var(--llama)";$("codeIn").value="";
  const f=$("codeForm"),extra=$("codeExtra");extra.innerHTML="";f.hidden=false;
  if(authOn()){
    const u=window.orbe.user;
    $("codeT").textContent=d.actT;
    if(!u){f.hidden=true;$("codeD").textContent=d.needLogin;extra.innerHTML=`<div class="row" style="flex-wrap:wrap;margin-top:6px"><button class="btn primary" data-a="signup">${d.signupBtn}</button><button class="btn" data-a="login">${d.loginBtn}</button></div>`}
    else if(!u.emailVerified){f.hidden=true;$("codeD").textContent=d.needVerify;extra.innerHTML=`<div class="row" style="flex-wrap:wrap;margin-top:6px"><button class="btn primary" data-a="check">${d.verifiedBtn}</button></div>`}
    else{$("codeD").textContent=d.licD;$("codeIn").placeholder="XXXX-XXXX-XXXX";extra.innerHTML=`<button class="btn" data-a="check" style="margin-top:4px">${d.checkBtn}</button>`}
  }else{$("codeT").textContent=d.codeT;$("codeD").textContent=d.codeD;$("codeIn").placeholder=""}
  if(!$("codeDlg").open)$("codeDlg").showModal();
}
$("codeExtra").addEventListener("click",async e=>{const a=e.target.dataset.a;if(!a)return;
  if(a==="signup"||a==="login"){$("codeDlg").close();window.orbe.openAuth(a)}
  if(a==="check"){e.target.disabled=true;await window.orbe.refreshPurchase();e.target.disabled=false;if(window.orbe.pro){$("codeDlg").close();toast(T[lang].codeGood)}else openCode(window.orbe.user.emailVerified?T[lang].noPurchase:T[lang].needVerify)}});
$("codeForm").addEventListener("submit",async e=>{e.preventDefault();const d=T[lang],v=$("codeIn").value.trim();if(!v)return;
  $("codeMsg").style.color="var(--muted)";$("codeMsg").textContent="…";
  if(authOn()){const r=await window.orbe.activateLicense(v);
    if(r.ok){$("codeMsg").style.color="#3DD68C";$("codeMsg").textContent=d.codeGood;setTimeout(()=>$("codeDlg").close(),1200)}
    else{$("codeMsg").style.color="var(--llama)";$("codeMsg").textContent=r.error==="network"?d.netErr:d.codeBad}
  }else{const ok=CFG.codes.includes(h(v));$("codeMsg").style.color="var(--llama)";$("codeMsg").textContent=ok?d.codeGood:d.codeBad;if(ok){localUnlock=true;store.set("unlocked",true);computeUnlock();render();setTimeout(()=>$("codeDlg").close(),1200)}}
});
$("codeClose").onclick=()=>$("codeDlg").close();

/* ===== eventos ===== */
$("slider").addEventListener("input",render);
$("presets").addEventListener("click",e=>{const p=e.target.dataset.p;if(p){$("slider").value=sliderFor(+p);render()}});
$("chips").addEventListener("click",e=>{const s=e.target.dataset.s;if(s){sector=s;document.querySelectorAll("#chips button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===s));render()}});
$("q").addEventListener("input",e=>{query=e.target.value.toLowerCase().trim();render()});
$("sort").addEventListener("change",e=>{sortBy=e.target.value;render()});
$("grid").addEventListener("click",e=>{const b=e.target.closest(".case");if(b)openCase(b.dataset.k)});
$("addBtn").onclick=()=>openCase(null,true);
$("codeBtn").onclick=openCode;
$("buyBtn").removeAttribute("target");$("buyBtn").href="#";
function goBuy(kind){const u=window.orbe&&window.orbe.checkoutUrl?window.orbe.checkoutUrl(kind):"";if(u){location.href=u}else{location.href="index.html#contacto"}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-buy]");if(b){e.preventDefault();goBuy(b.dataset.buy)}});
$("buyBtn").dataset.buy="brief";
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
$("csvBtn").onclick=()=>{const p=P(),rows=[["name","sector","mass_kg","revenue_usd","cost_usd","units_year","breakeven_usd_kg","launch_price_usd_kg","margin_per_unit","annual_result","profitable"]];
  cases().forEach(x=>{const m=x.r-x.c-x.m*p;rows.push([x.name,SECT[x.s].en,x.m,x.r,x.c,x.u,Math.round(x.be),p,Math.round(m),Math.round(m*x.u),p<=x.be?"yes":"no"])});
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv"}));a.download=`orbe-radar-${p}usd-kg.csv`;document.body.appendChild(a);a.click();a.remove();toast(T[lang].exported)};
$("shareBtn").onclick=()=>{const u=location.href;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast(T[lang].copied)).catch(()=>prompt("URL",u))};
const sf=$("subForm");
if(CFG.substack){sf.action=CFG.substack.replace(/\/$/,"")+"/api/v1/free?nojs=true";sf.addEventListener("submit",()=>setTimeout(()=>{toast(T[lang].subOk);sf.reset()},300))}
else sf.addEventListener("submit",async e=>{e.preventDefault();try{const nd={type:"newsletter",email:$("subEmail").value.trim(),message:"Suscripción al newsletter",lang,page:"radar"};if(window.orbe&&window.orbe.enabled)await window.orbe.saveContact(nd);else{const r=await fetch("https://formsubmit.co/ajax/"+encodeURIComponent(OC.contactEmail),{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({_subject:"orbe · newsletter",_captcha:"false",email:nd.email,pagina:"radar"})});if(!r.ok)throw 0}toast(T[lang].listOk);sf.reset()}catch(err){toast(T[lang].netErr)}});
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1800)}
$("dlg").addEventListener("click",e=>{if(e.target===$("dlg"))$("dlg").close()});
const root=document.documentElement;const th=store.get("theme",null);if(th)root.dataset.theme=th;
$("themeBtn").onclick=()=>{const light=root.dataset.theme?root.dataset.theme==="light":matchMedia("(prefers-color-scheme:light)").matches;root.dataset.theme=light?"dark":"light";store.set("theme",root.dataset.theme);if($("dlg").open)calc()};

// inicio: #es-6000
(function(){const m=location.hash.match(/^#(es|en|pt|fr)(?:-(\d+))?$/);let l=m?m[1]:store.get("lang",null);if(!T[l]){const n=(navigator.language||"es").slice(0,2);l=T[n]?n:"es"}
  $("slider").value=sliderFor(m&&m[2]?Math.min(10000,Math.max(10,+m[2])):7000);setLang(l);
  // Llegada desde Polar tras pagar: radar.html?paid=1
  const paid=new URLSearchParams(location.search).has("paid");
  if(!authOn()){if(paid&&!unlocked)openCode(T[lang].thanks);return}
  let first=true;
  window.orbe.on(async st=>{
    computeUnlock();render();
    if(!first)return;first=false;
    if(paid&&!st.pro){
      if(!st.user){window.orbe.openAuth("signup");toast(T[lang].paidSignup)}
      else{await window.orbe.refreshPurchase();computeUnlock();render();if(window.orbe.pro)toast(T[lang].thanksOk);else openCode(T[lang].thanks)}
    }
  });
})();
</script>
